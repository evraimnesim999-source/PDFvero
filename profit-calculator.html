<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حاسبة الربح - ShopCalc</title>

    <meta name="description"
          content="حاسبة ربح مجانية لحساب تكلفة المنتجات وسعر البيع وإجمالي الربح وهامش الربح.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-2: #60a5fa;
            --bg: #f5f9ff;
            --card: rgba(255,255,255,.88);
            --text: #172033;
            --muted: #64748b;
            --border: rgba(37,99,235,.14);
            --soft: #dbeafe;
            --shadow: 0 18px 50px rgba(37,99,235,.10);
        }

        body.dark {
            --bg: #0d1118;
            --card: rgba(24,31,43,.90);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: rgba(96,165,250,.16);
            --soft: #172b4d;
            --shadow: 0 18px 50px rgba(0,0,0,.35);
        }

        body {
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(96,165,250,.13),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(37,99,235,.08),
                    transparent 25%
                ),
                var(--bg);

            transition:
                background .3s,
                color .3s;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font-family: inherit;
        }

        /* NAVBAR */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,.65);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(18px);
        }

        body.dark .navbar {
            background: rgba(13,17,24,.72);
        }

        .nav {
            max-width: 1000px;
            margin: auto;
            padding: 14px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 22px;
            font-weight: 900;
        }

        .brand-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-2)
                );

            box-shadow:
                0 9px 22px
                rgba(37,99,235,.20);
        }

        .brand-name {
            color: var(--primary);
        }

        .nav-actions {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid var(--border);

            background:
                var(--card);

            color:
                var(--text);

            border-radius:
                12px;

            cursor:
                pointer;

            font-size:
                18px;

            transition:
                .2s;
        }

        .nav-btn:hover {
            border-color:
                var(--primary);

            transform:
                translateY(-2px);
        }


        /* HERO */

        .hero {
            max-width: 850px;
            margin: auto;
            padding: 65px 20px 30px;
            text-align: center;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding:
                8px 16px;

            border-radius:
                50px;

            background:
                rgba(37,99,235,.09);

            color:
                var(--primary);

            border:
                1px solid var(--border);

            font-size:
                14px;

            font-weight:
                bold;

            margin-bottom:
                20px;
        }

        .hero h1 {
            font-size:
                clamp(34px,6vw,55px);

            line-height:
                1.2;

            margin-bottom:
                12px;
        }

        .hero h1 span {
            color:
                var(--primary);
        }

        .hero p {
            color:
                var(--muted);

            font-size:
                17px;

            line-height:
                1.9;
        }


        /* CALCULATOR */

        .calculator {
            max-width: 800px;
            margin: 20px auto 60px;
            padding: 0 20px;
        }

        .calculator-card {
            padding: 30px;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius:
                25px;

            box-shadow:
                var(--shadow);

            backdrop-filter:
                blur(12px);
        }

        .field-group {
            display:
                grid;

            grid-template-columns:
                repeat(2,1fr);

            gap:
                18px;

            margin-bottom:
                20px;
        }

        .field {
            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;
        }

        .field label {
            font-weight:
                700;

            font-size:
                14px;
        }

        .field input {
            width:
                100%;

            padding:
                15px;

            border:
                2px solid var(--border);

            border-radius:
                13px;

            outline:
                none;

            background:
                var(--bg);

            color:
                var(--text);

            font-size:
                16px;

            transition:
                .2s;
        }

        .field input:focus {
            border-color:
                var(--primary);

            background:
                var(--card);
        }

        .calculate-btn {
            width:
                100%;

            border:
                none;

            padding:
                16px;

            border-radius:
                14px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-2)
                );

            color:
                white;

            font-size:
                17px;

            font-weight:
                900;

            cursor:
                pointer;

            box-shadow:
                0 10px 25px
                rgba(37,99,235,.20);

            transition:
                .2s;
        }

        .calculate-btn:hover {
            transform:
                translateY(-2px);

            filter:
                brightness(1.05);
        }


        /* RESULTS */

        .results {
            margin-top:
                28px;

            display:
                grid;

            grid-template-columns:
                repeat(2,1fr);

            gap:
                15px;
        }

        .result {
            padding:
                20px;

            border-radius:
                17px;

            background:
                var(--soft);

            border:
                1px solid var(--border);
        }

        .result span {
            display:
                block;

            color:
                var(--muted);

            font-size:
                13px;

            margin-bottom:
                5px;
        }

        .result strong {
            display:
                block;

            font-size:
                25px;

            color:
                var(--primary);
        }

        .profit-result {
            grid-column:
                1 / -1;

            background:
                linear-gradient(
                    135deg,
                    rgba(37,99,235,.12),
                    rgba(96,165,250,.18)
                );
        }

        .profit-result strong {
            font-size:
                32px;
        }

        .error {
            display:
                none;

            margin-top:
                18px;

            padding:
                13px;

            border-radius:
                12px;

            background:
                #fee2e2;

            color:
                #991b1b;

            text-align:
                center;
        }


        /* FOOTER */

        footer {
            padding:
                30px 20px;

            text-align:
                center;

            color:
                var(--muted);

            border-top:
                1px solid var(--border);

            background:
                var(--card);
        }

        footer strong {
            color:
                var(--primary);
        }


        /* MOBILE */

        @media (max-width: 650px) {

            .hero {
                padding:
                    50px 15px 25px;
            }

            .hero h1 {
                font-size:
                    35px;
            }

            .hero p {
                font-size:
                    15px;
            }

            .calculator {
                padding:
                    0 15px;
            }

            .calculator-card {
                padding:
                    22px 18px;
            }

            .field-group,
            .results {
                grid-template-columns:
                    1fr;
            }

            .profit-result {
                grid-column:
                    auto;
            }

        }

    </style>
</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="nav">

            <a href="shopcalc.html" class="brand">

                <div class="brand-icon">
                    🧮
                </div>

                <span class="brand-name">
                    ShopCalc
                </span>

            </a>


            <div class="nav-actions">

                <a
                    href="shopcalc.html"
                    class="nav-btn"
                    title="ShopCalc"
                >
                    🏠
                </a>

                <button
                    class="nav-btn"
                    id="themeBtn"
                    onclick="toggleTheme()"
                    title="الوضع الليلي"
                >
                    🌙
                </button>

            </div>

        </div>

    </header>


    <!-- HERO -->

    <main>

        <section class="hero">

            <div class="tag">
                💰 أدوات التجارة والحسابات
            </div>

            <h1>

                حاسبة
                <span>الربح</span>

            </h1>

            <p>

                أدخل تكلفة شراء المنتج وسعر بيعه والكمية،
                وسيقوم ShopCalc بحساب إجمالي المبيعات
                والتكلفة والربح وهامش الربح.

            </p>

        </section>


        <!-- CALCULATOR -->

        <section class="calculator">

            <div class="calculator-card">


                <div class="field-group">

                    <div class="field">

                        <label>
                            سعر شراء الوحدة
                        </label>

                        <input
                            type="number"
                            id="purchasePrice"
                            placeholder="مثال: 100"
                            min="0"
                            step="0.01"
                        >

                    </div>


                    <div class="field">

                        <label>
                            سعر بيع الوحدة
                        </label>

                        <input
                            type="number"
                            id="sellingPrice"
                            placeholder="مثال: 150"
                            min="0"
                            step="0.01"
                        >

                    </div>


                    <div class="field">

                        <label>
                            الكمية
                        </label>

                        <input
                            type="number"
                            id="quantity"
                            placeholder="مثال: 10"
                            min="1"
                            step="1"
                            value="1"
                        >

                    </div>


                </div>


                <button
                    class="calculate-btn"
                    onclick="calculateProfit()"
                >
                    🧮 احسب الربح
                </button>


                <div
                    class="error"
                    id="error"
                ></div>


                <!-- RESULTS -->

                <div
                    class="results"
                    id="results"
                    style="display:none;"
                >

                    <div class="result">

                        <span>
                            إجمالي تكلفة الشراء
                        </span>

                        <strong
                            id="totalCost"
                        >
                            0
                        </strong>

                    </div>


                    <div class="result">

                        <span>
                            إجمالي المبيعات
                        </span>

                        <strong
                            id="totalSales"
                        >
                            0
                        </strong>

                    </div>


                    <div class="result profit-result">

                        <span>
                            إجمالي الربح
                        </span>

                        <strong
                            id="totalProfit"
                        >
                            0
                        </strong>

                    </div>


                    <div class="result">

                        <span>
                            ربح الوحدة
                        </span>

                        <strong
                            id="unitProfit"
                        >
                            0
                        </strong>

                    </div>


                    <div class="result">

                        <span>
                            هامش الربح
                        </span>

                        <strong
                            id="profitMargin"
                        >
                            0%
                        </strong>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>

            © 2026

            <strong>
                ShopCalc
            </strong>

            — أدوات الحسابات والتجارة

        </p>

    </footer>


    <script>

        function number(value) {

            return parseFloat(value) || 0;

        }


        function calculateProfit() {

            const purchasePrice =
                number(
                    document.getElementById(
                        "purchasePrice"
                    ).value
                );


            const sellingPrice =
                number(
                    document.getElementById(
                        "sellingPrice"
                    ).value
                );


            const quantity =
                number(
                    document.getElementById(
                        "quantity"
                    ).value
                );


            const error =
                document.getElementById(
                    "error"
                );


            const results =
                document.getElementById(
                    "results"
                );


            if (
                purchasePrice <= 0 ||
                sellingPrice <= 0 ||
                quantity <= 0
            ) {

                error.textContent =
                    "من فضلك أدخل أسعارًا وكمية أكبر من صفر.";

                error.style.display =
                    "block";

                results.style.display =
                    "none";

                return;
            }


            const totalCost =
                purchasePrice *
                quantity;


            const totalSales =
                sellingPrice *
                quantity;


            const unitProfit =
                sellingPrice -
                purchasePrice;


            const totalProfit =
                unitProfit *
                quantity;


            const profitMargin =
                (
                    unitProfit /
                    purchasePrice
                ) *
                100;


            document.getElementById(
                "totalCost"
            ).textContent =
                formatNumber(totalCost);


            document.getElementById(
                "totalSales"
            ).textContent =
                formatNumber(totalSales);


            document.getElementById(
                "totalProfit"
            ).textContent =
                formatNumber(totalProfit);


            document.getElementById(
                "unitProfit"
            ).textContent =
                formatNumber(unitProfit);


            document.getElementById(
                "profitMargin"
            ).textContent =
                formatNumber(profitMargin) +
                "%";


            error.style.display =
                "none";


            results.style.display =
                "grid";
        }


        function formatNumber(value) {

            return new Intl.NumberFormat(
                "ar-EG",
                {
                    maximumFractionDigits: 2
                }
            ).format(value);

        }


        /* الوضع الليلي */

        function toggleTheme() {

            document.body.classList.toggle(
                "dark"
            );


            const isDark =
                document.body.classList.contains(
                    "dark"
                );


            localStorage.setItem(
                "shopcalc-theme",
                isDark
                    ? "dark"
                    : "light"
            );


            document.getElementById(
                "themeBtn"
            ).textContent =
                isDark
                    ? "☀️"
                    : "🌙";
        }


        /* تحميل الوضع */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                const savedTheme =
                    localStorage.getItem(
                        "shopcalc-theme"
                    );


                if (
                    savedTheme === "dark"
                ) {

                    document.body.classList.add(
                        "dark"
                    );

                    document.getElementById(
                        "themeBtn"
                    ).textContent =
                        "☀️";

                }

            }
        );


    </script>

</body>

</html>
