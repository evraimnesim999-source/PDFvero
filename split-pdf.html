<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تقسيم PDF - PDFora</title>

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            margin: 50px auto;
            padding: 40px 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #222;
        }

        p {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
        }

        input {
            margin: 20px 0;
            max-width: 100%;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin: 8px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        #downloadBtn {
            display: none;
            background: #16a34a;
        }

        .back {
            background: #555;
        }
    </style>
</head>

<body>

    <header>
        <h2>PDFora</h2>
    </header>

    <div class="container">

        <h1>تقسيم ملفات PDF</h1>

        <p>
            اختر ملف PDF وحدد الصفحات التي تريد استخراجها
        </p>

        <input
            type="file"
            id="pdfFile"
            accept=".pdf,application/pdf"
        >

        <br>

        <input
            type="text"
            id="pages"
            placeholder="مثال: 1,3,5"
        >

        <p>
            اكتب أرقام الصفحات مفصولة بفاصلة
        </p>

        <button onclick="splitPDF()">
            تقسيم الملف
        </button>

        <p id="message"></p>

        <button id="downloadBtn">
            تحميل الملف الجديد
        </button>

        <br>

        <button class="back" onclick="location.href='index.html'">
            العودة للرئيسية
        </button>

    </div>

    <script>

        async function splitPDF() {

            const fileInput = document.getElementById("pdfFile");
            const pagesInput = document.getElementById("pages");
            const message = document.getElementById("message");
            const downloadBtn = document.getElementById("downloadBtn");

            downloadBtn.style.display = "none";

            if (!fileInput.files.length) {
                message.textContent = "من فضلك اختر ملف PDF أولاً";
                return;
            }

            const pagesText = pagesInput.value.trim();

            if (!pagesText) {
                message.textContent =
                    "اكتب أرقام الصفحات التي تريد استخراجها";
                return;
            }

            try {

                message.textContent =
                    "جاري تقسيم الملف...";

                const file = fileInput.files[0];

                const bytes = await file.arrayBuffer();

                const sourcePdf =
                    await PDFLib.PDFDocument.load(bytes);

                const pageNumbers = pagesText
                    .split(",")
                    .map(page => parseInt(page.trim()));

                if (pageNumbers.some(isNaN)) {
                    message.textContent =
                        "اكتب أرقام صفحات صحيحة مثل: 1,3,5";
                    return;
                }

                const totalPages =
                    sourcePdf.getPageCount();

                if (pageNumbers.some(
                    page => page < 1 || page > totalPages
                )) {
                    message.textContent =
                        "هناك رقم صفحة غير موجود في الملف";
                    return;
                }

                const newPdf =
                    await PDFLib.PDFDocument.create();

                const zeroBasedPages =
                    [...new Set(pageNumbers)]
                    .map(page => page - 1);

                const copiedPages =
                    await newPdf.copyPages(
                        sourcePdf,
                        zeroBasedPages
                    );

                copiedPages.forEach(page => {
                    newPdf.addPage(page);
                });

                const newBytes =
                    await newPdf.save();

                const blob =
                    new Blob(
                        [newBytes],
                        { type: "application/pdf" }
                    );

                const url =
                    URL.createObjectURL(blob);

                message.textContent =
                    "تم استخراج " +
                    zeroBasedPages.length +
                    " صفحة بنجاح.";

                downloadBtn.style.display =
                    "inline-block";

                downloadBtn.onclick = function () {

                    const link =
                        document.createElement("a");

                    link.href = url;

                    link.download =
                        "split-pdf.pdf";

                    link.click();
                };

            } catch (error) {

                console.error(error);

                message.textContent =
                    "حدث خطأ أثناء تقسيم الملف.";

            }
        }

    </script>

</body>

</html>
